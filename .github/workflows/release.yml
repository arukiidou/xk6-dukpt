name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Release
    uses: grafana/xk6/.github/workflows/extension-release.yml@f5bf177c1181d7a64a0dc7b8d2b9492bd82ead39 # v1.4.15
    permissions:
      contents: write
    with:
      go-version: "1.26.x"
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v2.3.0"
      xk6-version: "1.4.15"
