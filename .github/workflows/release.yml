name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Release
    uses: grafana/xk6/.github/workflows/extension-release.yml@279c5f71399494d5c4f81aaddd536ae6b458d948 # v1.4.12
    permissions:
      contents: write
    with:
      go-version: "1.26.x"
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v2.2.0"
      xk6-version: "1.4.12"
